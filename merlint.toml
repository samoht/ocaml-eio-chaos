# A copy of Eio_mock's scheduler, kept as close to it as the changes allow,
# as eio-net's copy is.
[[rules]]
files = ["lib/quiet_mock.ml"]
exclude = ["E005"]

# A check reports whatever a program raises as the failure of a run, and a
# power cut ends the program whatever it raised: any exception that escapes
# the program is the run's outcome.
[[rules]]
files = ["lib/eio_chaos.ml"]
exclude = ["E105"]

# The test compiles a copy of the private Quiet_mock: it links no eio_chaos.
[[rules]]
files = ["test/quiet_mock/*"]
exclude = ["E606"]
